name: atvavrupa 24 saat DVR

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  dvr:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: FFmpeg kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Streams klasörünü oluştur
        run: |
          mkdir -p streams
          touch streams/.gitkeep

      - name: DVR'yi başlat
        run: python3 dvr.py

      - name: Değişiklikleri kaydet
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "DVR segmentleri güncellendi"
            git push
          fi
