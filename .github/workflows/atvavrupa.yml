name: ATV Avrupa Canli Yayin

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    permissions:
      contents: write

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Streams klasorunu hazirla
        run: |
          mkdir -p streams

      - name: Yayin takip sistemini baslat
        run: |
          python3 atvavrupa.py > atvavrupa.log 2>&1 &
          echo $! > stream.pid

      - name: Canli yayin degisikliklerini yukle
        run: |
          while true; do

            sleep 20

            if ! kill -0 "$(cat stream.pid)" 2>/dev/null; then
              echo "Python programi durdu."
              cat atvavrupa.log
              exit 1
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add -A streams/

            if ! git diff --cached --quiet; then

              git commit -m "ATV Avrupa canlı yayın güncellendi"

              git push origin HEAD:main

              echo "Yayin GitHub'a gonderildi."

            else

              echo "Yeni segment yok."

            fi

          done
