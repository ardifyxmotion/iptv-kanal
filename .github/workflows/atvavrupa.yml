name: ATV Avrupa Güncelleme

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: ATV Avrupa yayınını güncelle
        run: python atvavrupa.py

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
          else
            git commit -m "ATV Avrupa yayını güncellendi"
            git pull --rebase origin main
            git push origin main
          fi
