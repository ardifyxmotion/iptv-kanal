name: ATV Avrupa

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

jobs:
  update-atvavrupa:
    runs-on: ubuntu-latest

    steps:
      - name: Repository indiriliyor
        uses: actions/checkout@v4

      - name: Python kuruluyor
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli kütüphaneler kuruluyor
        run: |
          pip install -r requirements.txt

      - name: ATV Avrupa güncelleniyor
        run: |
          python atvavrupa.py

      - name: Değişiklikler GitHub'a yükleniyor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add atvavrupa_576p.m3u8

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
          else
            git commit -m "Update ATV Avrupa playlist"
            git pull --rebase origin main
            git push origin main
          fi
