name: atvavrupa realtime tracker

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atvavrupa-realtime
  cancel-in-progress: true

jobs:
  tracker:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını takip et ve güncelle
        run: |
          python atvavrupa.py &
          TRACKER_PID=$!

          while kill -0 $TRACKER_PID 2>/dev/null; do
            sleep 15

            git add streams/

            if git diff --cached --quiet; then
              echo "Yeni değişiklik yok."
              continue
            fi

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "atvavrupa realtime update"

            if ! git push origin HEAD:main; then
              echo "Push başarısız oldu."
              exit 1
            fi
          done
