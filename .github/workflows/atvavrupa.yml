name: ATV Avrupa Stream

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: write

concurrency:
  group: atvavrupa-stream
  cancel-in-progress: false

jobs:
  update-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Repository dosyalarını al
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Streams klasörünü oluştur
        run: |
          mkdir -p streams

      - name: ATV Avrupa yayını başlat
        run: |
          timeout 345m python atvavrupa.py
        continue-on-error: true

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Kaydedilecek değişiklik yok."
          else
            git commit -m "ATV Avrupa stream güncellendi"

            for i in 1 2 3 4 5; do
              git pull --rebase origin main && \
              git push origin main && break

              echo "Push başarısız, tekrar deneniyor..."
              sleep 5
            done
          fi
