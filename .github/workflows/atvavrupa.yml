name: atvavrupa update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install streamlink requests

      - name: ATV Avrupa yayınını güncelle
        run: python3 atvavrupa.py

      - name: Değişiklikleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/atvavrupa.m3u8
          git add streams/atvavrupa_state.txt
          git add streams/seg_*.ts

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "atvavrupa updated"
            git pull --rebase origin main
            git push origin main
          fi
