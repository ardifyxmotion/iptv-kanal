name: atvavrupa live update

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atvavrupa-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını sürekli takip et
        run: |
          for i in $(seq 1 28); do
            echo "=============================="
            echo "Kontrol: $(date -u)"
            echo "=============================="

            python atvavrupa.py || true

            git add streams/

            if git diff --cached --quiet; then
              echo "Yeni değişiklik yok."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "atvavrupa live update"

              for retry in 1 2 3; do
                if git push origin HEAD:main; then
                  echo "Değişiklik anında GitHub'a gönderildi."
                  break
                fi

                echo "Push başarısız, tekrar deneniyor..."
                git pull --rebase origin main || true
                sleep 5
              done
            fi

            echo "10 saniye bekleniyor..."
            sleep 10
          done
