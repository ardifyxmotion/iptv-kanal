name: ATV Avrupa Canli Yayin

on:
  workflow_dispatch:

jobs:
  stream:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli kutuphaneleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Streams klasorunu hazirla
        run: |
          mkdir -p streams

      - name: Yayin takibini baslat
        run: |
          python3 atvavrupa.py &
          echo $! > stream.pid

      - name: Degisiklikleri periyodik olarak yukle
        run: |
          while true; do
            sleep 120

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add streams/

            if ! git diff --cached --quiet; then
              git commit -m "ATV Avrupa yayın güncellendi"

              git pull --rebase origin main || true

              git push origin main || true

              echo "Yayın dosyaları GitHub'a gönderildi."
            else
              echo "Yeni değişiklik yok."
            fi
          done
