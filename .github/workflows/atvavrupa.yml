name: atvavrupa live tracker

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atvavrupa-live-tracker
  cancel-in-progress: true

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını anlık takip et
        run: |
          python atvavrupa.py &
          PYTHON_PID=$!

          while kill -0 $PYTHON_PID 2>/dev/null; do
            sleep 30

            git add streams/

            if git diff --cached --quiet; then
              echo "Henüz GitHub'a gönderilecek değişiklik yok."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "atvavrupa live update"

              git push origin HEAD:main || echo "Push sonraki kontrolde tekrar denenecek."
            fi
          done
