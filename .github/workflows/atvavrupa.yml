name: atvavrupa update

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Kurulum
        run: pip install -q streamlink requests

      - name: Çalıştır
        run: python3 atvavrupa.py

      - name: Git Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams/

          if ! git diff --cached --quiet; then
            git commit -m "ATV Avrupa DVR güncellemesi $(date -u +'%Y-%m-%d %H:%M')"
            git pull --rebase origin main
            git push origin main
          else
            echo "Değişiklik yok."
          fi
