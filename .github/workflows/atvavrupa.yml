name: atvavrupa stable live update

on:
  schedule:
    - cron: "* * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: atvavrupa-stable-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını stabil takip et
        run: |
          for i in $(seq 1 100); do
            echo "Kontrol: $(date -u)"

            python atvavrupa.py

            git add streams/

            if git diff --cached --quiet; then
              echo "Yeni değişiklik yok."
            else
              git config user.name "github-actions[bot]"
              git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

              git commit -m "atvavrupa live update"

              if ! git pull --rebase origin main; then
                echo "Pull/rebase başarısız."
                exit 1
              fi

              if ! git push origin HEAD:main; then
                echo "Push başarısız."
                exit 1
              fi

              echo "Güncelleme gönderildi."
            fi

            sleep 30
          done
