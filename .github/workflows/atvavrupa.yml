name: atvavrupa stable live update

on:
  schedule:
    - cron: "5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

# Aynı anda sadece TEK workflow çalışsın.
# Yeni tetiklemeler mevcut işlemi iptal etmesin.
concurrency:
  group: atvavrupa-stable-live
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 55

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını stabil takip et
        run: |
          for i in $(seq 1 100); do
            echo "=============================="
            echo "Kontrol: $(date -u)"
            echo "=============================="

            python atvavrupa.py || true

            # Değişiklik yoksa Git işlemi yapma
            if git diff --quiet -- streams/; then
              echo "Yeni değişiklik yok."
              sleep 30
              continue
            fi

            # Önce çalışma ağacındaki değişiklikleri sakla
            git add streams/

            # Commit oluştur
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git commit -m "atvavrupa live update"

            # Uzak depoda yeni commit varsa rebase çatışması
            # oluşturmadan bu workflow'u yeniden başlat.
            if ! git push origin HEAD:main; then
              echo "Push çakışması oluştu."

              # Yerel değişiklik zaten commit edildiği için
              # uzak depodaki son sürümü alıp commit'i tekrar uygula.
              git fetch origin main

              if git rebase origin/main; then
                git push origin HEAD:main
              else
                echo "Çakışma oluştu. Rebase iptal ediliyor."
                git rebase --abort || true

                # Uzak depodaki son sürüme dön.
                # Bir sonraki 30 saniyelik kontrolde yayın yeniden oluşturulur.
                git reset --hard origin/main

                sleep 30
                continue
              fi
            fi

            echo "Güncelleme gönderildi."

            sleep 30
          done
