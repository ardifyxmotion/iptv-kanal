name: atvavrupa update

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'yi indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Python kurulumu
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
          cache: "pip"

      - name: FFmpeg kurulumu
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Gerekli paketleri kur
        run: |
          pip install -q streamlink requests

      - name: ATV Avrupa yayını güncelle
        run: python3 atvavrupa.py

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "ATV Avrupa Sync $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          fi
