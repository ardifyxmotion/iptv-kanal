name: ATV Avrupa Canlı Takip

on:
  workflow_dispatch:
  schedule:
    # Bir çalışma yaklaşık 5 dakika sürdüğü için
    # sonraki çalışma hemen başlar.
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: atvavrupa-stream
  cancel-in-progress: false

jobs:
  update-stream:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Canlı yayını takip et
        run: python atvavrupa.py

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "ATV Avrupa segmentleri güncellendi"
            git pull --rebase origin main
            git push origin main
          fi
