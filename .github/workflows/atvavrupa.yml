name: ATV Avrupa

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

jobs:
  update-stream:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli paketleri yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını güncelle
        run: python atvavrupa.py

      - name: Değişiklikleri GitHub'a kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/atvavrupa.m3u8 streams/seg_*.ts

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "ATV Avrupa yayını güncellendi"
            git push
          fi
