name: ATV Avrupa Stream

on:
  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: atvavrupa-stream
  cancel-in-progress: false

jobs:
  stream:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Paketleri kur
        run: |
          python -m pip install --upgrade pip
          pip install requests streamlink

      - name: Yayını sürekli takip et
        run: |
          timeout 340m python atvavrupa.py
        continue-on-error: true

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add streams/

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "ATV Avrupa yayın güncellemesi"

            for i in 1 2 3 4 5; do
              git pull --rebase origin main && git push origin main && exit 0

              echo "Push tekrar deneniyor..."
              sleep 5
            done

            exit 1
          fi
