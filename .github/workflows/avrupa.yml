name: Update ATV AVRUPA M3U8

on:
  schedule:
    - cron: "16 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-m3u8:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Gerekli kütüphaneleri yükle
        run: |
          pip install requests

      - name: ATV Avrupa M3U8 güncelle
        run: |
          python res/26-2/avrupa.py > res/26-2/avrupa.m3u8

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add res/26-2/avrupa.m3u8

          if git diff --cached --quiet; then
            echo "Değişiklik bulunamadı."
          else
            git commit -m "ATV Avrupa M3U8 güncellendi"
            git push origin main
          fi
