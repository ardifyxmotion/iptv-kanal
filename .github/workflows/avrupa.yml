name: Update ATV Avrupa M3U8

on:
  schedule:
    - cron: "16 */2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright kur
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium

      - name: ATV Avrupa bağlantısını bul
        run: |
          python res/26-2/avrupa.py > res/26-2/avrupa.m3u8

      - name: Sonucu göster
        run: |
          cat res/26-2/avrupa.m3u8

      - name: Değişiklikleri kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add res/26-2/avrupa.m3u8

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "avrupa updated"
            git push
          fi
