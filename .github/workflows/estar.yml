```yaml
name: Update Eurostar M3U8

on:
  schedule:
    - cron: "16 */2 * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Repository'i indir
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Son değişiklikleri al
        run: |
          git pull --rebase origin main

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Playwright yükle
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Eurostar M3U8 bul
        run: |
          python res/26-2/estar.py > res/26-2/estar.m3u8

      - name: Bulunan bağlantıyı kontrol et
        run: |
          echo "Oluşturulan M3U8 dosyası:"
          cat res/26-2/estar.m3u8

      - name: Değişiklikleri GitHub'a gönder
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add res/26-2/estar.m3u8

          if git diff --cached --quiet; then
            echo "Değişiklik yok."
          else
            git commit -m "estar updated"
            git push origin main
          fi
```
