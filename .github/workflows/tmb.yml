name: TMB TV

on:
  workflow_dispatch:

  schedule:
    - cron: "*/15 * * * *"

jobs:
  update:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Depoyu indir
        uses: actions/checkout@v4

      - name: Python kur
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Python dosyasını çalıştır
        run: python tmb.py

      - name: Değişiklikleri kaydet
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          git add tmb.m3u8

          git diff --staged --quiet || (
            git commit -m "TMB playlist updated"
            git push
          )
